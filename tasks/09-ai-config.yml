---
# 09-ai-config.yml — machine-local AI-assistant configuration, driven entirely
# by files/agent-map.json. ~/bin/ai-sync reads that one manifest and loops it
# generically — no tool is enumerated in code, so adding a tool or class is a
# manifest edit alone.
#
# ai-sync is the one wiring engine for both operating scenarios (cloud.sh runs
# it in cloud sessions). From the manifest it:
#   hub          — links ~/.config/ai/ into the workspace repo's ai/ shared
#                  sources (AGENTS.md, mcp.json, commands/, skills/, agents/,
#                  rules/), non-destructively.
#   link/import  — points each present tool's own path at a hub source.
#   generate/wrap — renders hub sources into tool-specific formats.
#
# Two taggable parts: ai-config (manifest deploy, below) and ai-sync (engine
# deploy and run, 09-ai-sync.yml).

- name: Ensure ~/.config/ai exists
  ansible.builtin.file:
    path: "{{ home_dir }}/.config/ai"
    state: directory
    mode: "0755"
  tags: [ai-config]

- name: Deploy the sync manifest (for ~/bin/ai-sync to read at runtime)
  ansible.builtin.copy:
    src: agent-map.json
    dest: "{{ home_dir }}/.config/ai/agent-map.json"
    mode: "0644"
  tags: [ai-config]

- name: Wire present tools to the hub + render generated formats
  ansible.builtin.import_tasks: 09-ai-sync.yml
  tags: [ai-sync]
...
