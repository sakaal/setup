---
# 09-ai-sync.yml — deploy the AI tooling and run ai-sync, which builds the hub,
# wires each present tool to it and renders generated formats, all driven by
# the manifest. Imported by 09-ai-config.yml.
#
# Wiring is non-destructive: absent/empty/already-ours → act/noop; real content
# → reported and halted on, never clobbered. ~/bin/ai-harvest (harvest-lane
# catalog) and ~/bin/ai-distill (the distillation prepare/accept bookends) are
# deployed alongside but never run by the playbook — harvesting and
# distillation are curation-time actions, not part of the bootstrap.
#
# Only user-scope entries are wired. Workspace-scope entries in the manifest
# document locations applied at the workspace root (inherited by the projects
# inside), not by setup.

- name: Ensure ~/bin exists
  ansible.builtin.file:
    path: "{{ home_dir }}/bin"
    state: directory
    mode: "0755"

- name: Deploy the format renderer (~/bin/ai-sync)
  ansible.builtin.copy:
    src: ai-sync
    dest: "{{ home_dir }}/bin/ai-sync"
    mode: "0755"

- name: Deploy the harvest collector (~/bin/ai-harvest)
  ansible.builtin.copy:
    src: ai-harvest
    dest: "{{ home_dir }}/bin/ai-harvest"
    mode: "0755"

- name: Deploy the distillation bookends (~/bin/ai-distill)
  ansible.builtin.copy:
    src: ai-distill
    dest: "{{ home_dir }}/bin/ai-distill"
    mode: "0755"

- name: Ensure the AI shared-data directory exists
  ansible.builtin.file:
    path: "{{ home_dir }}/.local/share/ai"
    state: directory
    mode: "0755"

# ai-distill's identifier screen (§7 req 5.a) recognizes ordinary known words so
# it does not redact them as identifiers. The word set is layered: the vendored,
# integrity-pinned SCOWL English list, plus cspell's curated software-terms list
# (ssh/sdk/ansible/…); each NOTICE carries its licence.
- name: Deploy the identifier-screen wordlists (SCOWL + cspell) and notices
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ home_dir }}/.local/share/ai/{{ item.dest }}"
    mode: "0644"
  loop:
    - {src: ai-wordlist.txt.gz, dest: wordlist.txt.gz}
    - {src: ai-wordlist.NOTICE, dest: wordlist.NOTICE}
    - {src: ai-terms.txt, dest: terms.txt}
    - {src: ai-terms.NOTICE, dest: terms.NOTICE}

# Runs the repo's copy against the repo's manifest, so --check (where the
# deploys above are skipped) previews the same engine with --dry-run.
- name: Wire present tools and render generated formats (local scenario)
  ansible.builtin.command:
    cmd: >-
      python3 "{{ playbook_dir }}/files/ai-sync" --scenario local
      --manifest "{{ playbook_dir }}/files/agent-map.json"
      --workspace "{{ home_dir }}/{{ workspace_dir }}"
      {{ '--dry-run' if ansible_check_mode else '' }}
  register: ai_sync_run
  changed_when: >-
    '→ changed:' in ai_sync_run.stdout
    or '→ would change:' in ai_sync_run.stdout
  failed_when: false
  check_mode: false

- name: Sync report
  ansible.builtin.debug:
    msg: "{{ ai_sync_run.stdout_lines }}"
  when: ai_sync_run.stdout_lines | default([]) | length > 0

- name: Halt on wiring conflicts (nothing was overwritten)
  ansible.builtin.fail:
    msg: >-
      Refusing to overwrite existing path(s) that hold content and are not the
      shared hub link, tool link or stub (see the conflicts above). Reconcile
      each (move its content into ai/ in the workspace repo, remove the local
      path) and re-run — or skip with --skip-tags ai-sync.
  when: ai_sync_run.rc == 2

- name: Halt when ai-sync fails
  ansible.builtin.fail:
    msg: "ai-sync failed (exit {{ ai_sync_run.rc }}): {{ ai_sync_run.stderr }}"
  when: ai_sync_run.rc not in [0, 2]
...
